name: Build Komodo Wallet

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Workaround git protocol error
        run: |
          echo -e '[url "https://github.com/"]\n  insteadOf = "git://github.com/"' >> ~/.gitconfig

      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Java 11 for Flutter build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.8.1'
          architecture: x64
          cache: true

      - name: Get dependencies
        run: flutter pub get --suppress-analytics

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download compatible MM2 Android libraries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app/src/main/cpp/libs/armeabi-v7a
          mkdir -p android/app/src/main/cpp/libs/arm64-v8a

          curl -fL --retry 3 \
            "https://github.com/KomodoPlatform/komodo-defi-framework/releases/download/v1.0.7-beta/mm2-79f620559-android-armv7-CI.zip" \
            -o /tmp/mm2-armv7.zip

          curl -fL --retry 3 \
            "https://github.com/KomodoPlatform/komodo-defi-framework/releases/download/v1.0.7-beta/mm2-79f620559-android-aarch64-CI.zip" \
            -o /tmp/mm2-arm64.zip

          echo "698ac14b0f50d1695529640644c4c3117af7c5ee7e1f1c2dae92f985fd100691  /tmp/mm2-armv7.zip" \
            | sha256sum -c -

          echo "d9febb4d1427352d4b8eac5cabe12ee8bcfd98ee6a5f91d18eed223fc7b0a612  /tmp/mm2-arm64.zip" \
            | sha256sum -c -

          ARMV7_FILE="$(
            unzip -Z1 /tmp/mm2-armv7.zip |
            grep -E '(^|/)libmm2\.a$' |
            head -1
          )"

          ARM64_FILE="$(
            unzip -Z1 /tmp/mm2-arm64.zip |
            grep -E '(^|/)libmm2\.a$' |
            head -1
          )"

          test -n "$ARMV7_FILE"
          test -n "$ARM64_FILE"

          unzip -p /tmp/mm2-armv7.zip "$ARMV7_FILE" \
            > android/app/src/main/cpp/libs/armeabi-v7a/libmm2.a

          unzip -p /tmp/mm2-arm64.zip "$ARM64_FILE" \
            > android/app/src/main/cpp/libs/arm64-v8a/libmm2.a

          test -s android/app/src/main/cpp/libs/armeabi-v7a/libmm2.a
          test -s android/app/src/main/cpp/libs/arm64-v8a/libmm2.a

          ls -lh \
            android/app/src/main/cpp/libs/armeabi-v7a/libmm2.a \
            android/app/src/main/cpp/libs/arm64-v8a/libmm2.a

      - name: Create API binaries directory
        run: mkdir -p build/api-binaries

      - name: Copy API binaries
        run: |
          cp \
            android/app/src/main/cpp/libs/armeabi-v7a/libmm2.a \
            build/api-binaries/libmm2-armeabi-v7a.a

          cp \
            android/app/src/main/cpp/libs/arm64-v8a/libmm2.a \
            build/api-binaries/libmm2-arm64-v8a.a

      - name: Upload API binaries
        uses: actions/upload-artifact@v4
        with:
          name: api-binaries
          path: build/api-binaries/
          if-no-files-found: error

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info/

      - name: Save generated APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Save debug info
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-info
          path: build/debug-info/
          if-no-files-found: error
