name: Build Komodo Wallet

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  build-mm2:
    name: Build MM2 Android libraries
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: komodoofficial/ci-container:latest

    steps:
      - name: Checkout Komodo DeFi Framework
        uses: actions/checkout@v4
        with:
          repository: KomodoPlatform/komodo-defi-framework
          ref: v1.0.7-beta
          path: kdf

      - name: Configure build environment
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE/kdf"
          echo "/bin" >> "$GITHUB_PATH"
          echo "/usr/bin" >> "$GITHUB_PATH"
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"

          rustup toolchain install nightly-2022-10-29 \
            --no-self-update \
            --profile minimal
          rustup default nightly-2022-10-29
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

          cd kdf
          ./scripts/ci/android-ndk.sh x86 21

      - name: Build MM2 for ARM64 and ARMv7
        shell: bash
        run: |
          set -euo pipefail
          cd kdf

          COMMIT_HASH="$(git rev-parse --short=7 HEAD)"
          rm -f MM_VERSION
          printf '%s\n' "$COMMIT_HASH" > MM_VERSION

          export PATH="$PATH:/android-ndk/bin"

          CC_aarch64_linux_android=aarch64-linux-android21-clang \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android21-clang \
          cargo rustc \
            --target=aarch64-linux-android \
            --lib \
            --release \
            --crate-type=staticlib \
            --package mm2_bin_lib

          CC_armv7_linux_androideabi=armv7a-linux-androideabi21-clang \
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=armv7a-linux-androideabi21-clang \
          cargo rustc \
            --target=armv7-linux-androideabi \
            --lib \
            --release \
            --crate-type=staticlib \
            --package mm2_bin_lib

          mkdir -p ../mm2-libs/arm64-v8a
          mkdir -p ../mm2-libs/armeabi-v7a

          cp \
            target/aarch64-linux-android/release/libmm2lib.a \
            ../mm2-libs/arm64-v8a/libmm2.a

          cp \
            target/armv7-linux-androideabi/release/libmm2lib.a \
            ../mm2-libs/armeabi-v7a/libmm2.a

      - name: Verify required native symbols
        shell: bash
        run: |
          set -euo pipefail

          for library in \
            mm2-libs/arm64-v8a/libmm2.a \
            mm2-libs/armeabi-v7a/libmm2.a
          do
            echo "Checking $library"
            file "$library"
            nm -g --defined-only "$library" > /tmp/mm2-symbols.txt

            for symbol in mm2_main mm2_main_status mm2_stop
            do
              if grep -qE "[[:space:]]${symbol}$" /tmp/mm2-symbols.txt; then
                echo "OK: $symbol"
              else
                echo "ERROR: missing $symbol in $library"
                exit 1
              fi
            done
          done

      - name: Upload MM2 Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: mm2-android-libraries
          path: mm2-libs/
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK
    needs: build-mm2
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Workaround git protocol error
        shell: bash
        run: |
          echo -e '[url "https://github.com/"]\n  insteadOf = "git://github.com/"' >> ~/.gitconfig

      - name: Checkout wallet code
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Java 11 for Flutter build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.8.1'
          architecture: x64
          cache: true

      - name: Get dependencies
        run: flutter pub get --suppress-analytics

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download MM2 Android libraries
        uses: actions/download-artifact@v4
        with:
          name: mm2-android-libraries
          path: android/app/src/main/cpp/libs

      - name: Verify downloaded libraries
        shell: bash
        run: |
          set -euo pipefail

          for library in \
            android/app/src/main/cpp/libs/arm64-v8a/libmm2.a \
            android/app/src/main/cpp/libs/armeabi-v7a/libmm2.a
          do
            test -s "$library"
            nm -g --defined-only "$library" > /tmp/mm2-symbols.txt

            for symbol in mm2_main mm2_main_status mm2_stop
            do
              grep -qE "[[:space:]]${symbol}$" /tmp/mm2-symbols.txt || {
                echo "ERROR: missing $symbol in $library"
                exit 1
              }
            done
          done

      - name: Create API binaries directory
        run: mkdir -p build/api-binaries

      - name: Copy API binaries
        shell: bash
        run: |
          cp \
            android/app/src/main/cpp/libs/armeabi-v7a/libmm2.a \
            build/api-binaries/libmm2-armeabi-v7a.a

          cp \
            android/app/src/main/cpp/libs/arm64-v8a/libmm2.a \
            build/api-binaries/libmm2-arm64-v8a.a

      - name: Upload API binaries
        uses: actions/upload-artifact@v4
        with:
          name: api-binaries
          path: build/api-binaries/
          if-no-files-found: error

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info/

      - name: Save generated APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Save debug info
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-info
          path: build/debug-info/
          if-no-files-found: error
